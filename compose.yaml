services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    ports:
      - "3001:3001"
    volumes:
      - ./server:/app
      - backend_node_modules:/app/node_modules

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_TARGET=http://backend:3001

volumes:
  backend_node_modules: {}
  frontend_node_modules: {}