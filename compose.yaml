
services:
  frontend:       
    build: .                  #Look for a Dockerfile in the current directory, build image from it
    ports: 
      - '9000:9000'             #localhost:9000 -> container 9000 
    volumes:
      - .:/app                          #Mounted project directory
      - frontend_node_modules:/app/node_modules          #node_modules inside the container
    environment:
      - CHOKIDAR_USEPOLLING=true                 #allows for hot reload
volumes:
  frontend_node_modules: {}          #defines the named volume

